name: release
# A tag vX.Y.Z (or vX.Y.Z-rc.1) tests the tagged commit, then publishes: the image (ghcr.io/<owner>/blobgate, linux/amd64 and linux/arm64, with provenance and an SBOM), the chart
# (oci://ghcr.io/<owner>/charts/blobgate) and a GitHub release with the program for linux/amd64 and linux/arm64 and its checksums.
on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+*"]
permissions:
  contents: read
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  ci:
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  publish:
    needs: ci
    runs-on: ubuntu-24.04
    permissions:
      contents: write     # the release
      packages: write     # the image and the chart
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: the version
        id: v
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          ver="${tag#v}"
          [[ "$ver" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]] || { echo "not a version: $tag"; exit 1; }
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          pre=false; [[ "$ver" == *-* ]] && pre=true
          { echo "tag=$tag"; echo "ver=$ver"; echo "owner=$owner"; echo "pre=$pre"; echo "minor=${ver%.*}"; } >> "$GITHUB_OUTPUT"
      - name: the image
        env:
          VER: ${{ steps.v.outputs.ver }}
          OWNER: ${{ steps.v.outputs.owner }}
          PRE: ${{ steps.v.outputs.pre }}
          MINOR: ${{ steps.v.outputs.minor }}
        run: |
          set -euo pipefail
          image="ghcr.io/${OWNER}/blobgate"
          tags=(-t "$image:$VER")
          if [ "$PRE" = false ]; then tags+=(-t "$image:$MINOR" -t "$image:latest"); fi
          docker buildx create --use --driver docker-container >/dev/null
          docker buildx build --platform linux/amd64,linux/arm64 --push --provenance=mode=max --sbom=true \
            --build-arg "VERSION=$VER" --build-arg "REVISION=$GITHUB_SHA" "${tags[@]}" .
      - name: the program and its checksums
        env:
          VER: ${{ steps.v.outputs.ver }}
        run: |
          set -euo pipefail
          mkdir dist
          for arch in amd64 arm64; do
            CGO_ENABLED=0 GOOS=linux GOARCH=$arch go build -trimpath -ldflags="-s -w -X main.version=$VER" -o "dist/blobgate" ./cmd/blobgate
            tar -C dist -czf "dist/blobgate_${VER}_linux_${arch}.tar.gz" blobgate
            rm dist/blobgate
          done
          (cd dist && sha256sum ./*.tar.gz > checksums.txt)
      - name: the chart
        env:
          VER: ${{ steps.v.outputs.ver }}
          OWNER: ${{ steps.v.outputs.owner }}
        run: |
          set -euo pipefail
          helm package charts/blobgate --version "$VER" --app-version "$VER" --destination dist
          echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io -u "${{ github.actor }}" --password-stdin
          helm push "dist/blobgate-${VER}.tgz" "oci://ghcr.io/${OWNER}/charts"
      - name: the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.v.outputs.tag }}
          VER: ${{ steps.v.outputs.ver }}
          OWNER: ${{ steps.v.outputs.owner }}
          PRE: ${{ steps.v.outputs.pre }}
        run: |
          set -euo pipefail
          # the notes: the section of CHANGELOG.md for this version, else a line that says where the changes are
          awk -v v="$VER" '$0 ~ "^## \\[" v "\\]" {on=1; next} /^## \[/ {on=0} on' CHANGELOG.md > notes.md
          [ -s notes.md ] || echo "See CHANGELOG.md." > notes.md
          {
            echo
            echo "Image: \`ghcr.io/${OWNER}/blobgate:${VER}\` (linux/amd64, linux/arm64)"
            echo "Chart: \`oci://ghcr.io/${OWNER}/charts/blobgate --version ${VER}\`"
          } >> notes.md
          flags=(); [ "$PRE" = true ] && flags+=(--prerelease)
          gh release create "$TAG" dist/*.tar.gz dist/checksums.txt "dist/blobgate-${VER}.tgz" --title "blobgate $VER" --notes-file notes.md "${flags[@]}" --verify-tag
