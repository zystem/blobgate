{{- if .Values.serviceMonitor.enabled }}
{{- if not .Values.config.metricsPort }}{{- fail "serviceMonitor needs config.metricsPort" }}{{- end }}
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: {{ include "blobgate.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "blobgate.labels" . | nindent 4 }}
    {{- with .Values.serviceMonitor.labels }}{{ toYaml . | nindent 4 }}{{- end }}
spec:
  selector:
    matchLabels: {{- include "blobgate.selector" . | nindent 6 }}
  endpoints:
    - {port: metrics, path: /metrics, interval: {{ .Values.serviceMonitor.interval }}}
{{- end }}
