{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "blobgate.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels: {{- include "blobgate.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels: {{- include "blobgate.selector" . | nindent 6 }}
  policyTypes: [Ingress]
  ingress:
    - ports:
        - {port: {{ .Values.config.port }}, protocol: TCP}
        {{- if .Values.config.shimPort }}
        - {port: {{ .Values.config.shimPort }}, protocol: TCP}
        {{- end }}
        {{- if .Values.config.s3Port }}
        - {port: {{ .Values.config.s3Port }}, protocol: TCP}
        {{- end }}
        {{- if .Values.config.metricsPort }}
        - {port: {{ .Values.config.metricsPort }}, protocol: TCP}
        {{- end }}
      {{- if .Values.networkPolicy.allowedFrom }}
      from: {{- toYaml .Values.networkPolicy.allowedFrom | nindent 8 }}
      {{- end }}
{{- end }}
