{{- if not .Values.rqliteUrl }}{{- fail "rqliteUrl is required: the rqlite the module keeps its records in" }}{{- end }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "blobgate.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels: {{- include "blobgate.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicas }}
  selector:
    matchLabels: {{- include "blobgate.selector" . | nindent 6 }}
  strategy:
    type: RollingUpdate
    rollingUpdate: {maxUnavailable: 0, maxSurge: 1}
  template:
    metadata:
      labels:
        {{- include "blobgate.labels" . | nindent 8 }}
        {{- with .Values.podLabels }}{{ toYaml . | nindent 8 }}{{- end }}
      annotations:
        {{- /* a change of a value of the chart that the Secret is made from restarts the Pods */}}
        checksum/secret: {{ include (print $.Template.BasePath "/secret.yaml") . | sha256sum }}
        {{- with .Values.podAnnotations }}{{ toYaml . | nindent 8 }}{{- end }}
    spec:
      automountServiceAccountToken: false
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets: {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext: {runAsNonRoot: true, runAsUser: 65532, runAsGroup: 65532, seccompProfile: {type: RuntimeDefault}}
      terminationGracePeriodSeconds: 40   # the program finishes the requests that are going on for up to 30 s
      containers:
        - name: blobgate
          image: {{ include "blobgate.image" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - {name: http, containerPort: {{ .Values.config.port }}}
            {{- if .Values.config.shimPort }}
            - {name: shim, containerPort: {{ .Values.config.shimPort }}}
            {{- end }}
            {{- if .Values.config.s3Port }}
            - {name: s3, containerPort: {{ .Values.config.s3Port }}}
            {{- end }}
            {{- if .Values.config.metricsPort }}
            - {name: metrics, containerPort: {{ .Values.config.metricsPort }}}
            {{- end }}
          env:
            - {name: BLOBGATE_RQLITE_URL, value: {{ .Values.rqliteUrl | quote }}}
            - {name: BLOBGATE_PORT, value: {{ .Values.config.port | toString | quote }}}
            - {name: BLOBGATE_SHIM_PORT, value: {{ .Values.config.shimPort | toString | quote }}}
            {{- if .Values.config.s3Port }}
            - {name: BLOBGATE_S3_PORT, value: {{ .Values.config.s3Port | toString | quote }}}
            {{- end }}
            # the key is `tenants`; a Secret of the first version has `shards`: either is read (a variable whose key is not there is left out)
            - name: BLOBGATE_TENANTS
              valueFrom: {secretKeyRef: {name: {{ include "blobgate.secret" . }}, key: tenants, optional: true}}
            - name: CINIM_STORAGE_SHARDS
              valueFrom: {secretKeyRef: {name: {{ include "blobgate.secret" . }}, key: shards, optional: true}}
            - name: BLOBGATE_ADMIN_TOKEN
              valueFrom: {secretKeyRef: {name: {{ include "blobgate.secret" . }}, key: adminToken}}
            - name: BLOBGATE_SEAL_KEY
              valueFrom: {secretKeyRef: {name: {{ include "blobgate.secret" . }}, key: sealKey}}
            {{- include "blobgate.optEnv" (dict "name" "BLOBGATE_METRICS_PORT" "value" .Values.config.metricsPort) | nindent 12 }}
            {{- include "blobgate.optEnv" (dict "name" "BLOBGATE_THREADS" "value" .Values.config.threads) | nindent 12 }}
            {{- include "blobgate.optEnv" (dict "name" "BLOBGATE_RESERVE_BYTES" "value" .Values.config.reserveBytes) | nindent 12 }}
            {{- include "blobgate.optEnv" (dict "name" "BLOBGATE_REPAIR_SECONDS" "value" .Values.config.repairSeconds) | nindent 12 }}
            {{- include "blobgate.optEnv" (dict "name" "BLOBGATE_REPAIR_RETRY_SECONDS" "value" .Values.config.repairRetrySeconds) | nindent 12 }}
            {{- include "blobgate.optEnv" (dict "name" "BLOBGATE_CHECK_SECONDS" "value" .Values.config.checkSeconds) | nindent 12 }}
            {{- include "blobgate.optEnv" (dict "name" "BLOBGATE_LEASE_SECONDS" "value" .Values.config.leaseSeconds) | nindent 12 }}
            {{- include "blobgate.optEnv" (dict "name" "BLOBGATE_UPLOAD_TTL_SECONDS" "value" .Values.config.uploadTtlSeconds) | nindent 12 }}
            {{- include "blobgate.optEnv" (dict "name" "BLOBGATE_DEEP_CHECK" "value" (ternary "1" "" .Values.config.deepCheck)) | nindent 12 }}
            {{- include "blobgate.optEnv" (dict "name" "BLOBGATE_DEEP_CHECK_BYTES_PER_SECOND" "value" .Values.config.deepCheckBytesPerSecond) | nindent 12 }}
            {{- if .Values.backup.existingSecret }}
            - name: BLOBGATE_BACKUP_NODES
              valueFrom: {secretKeyRef: {name: {{ .Values.backup.existingSecret }}, key: nodes}}
            - name: BLOBGATE_BACKUP_KEY
              valueFrom: {secretKeyRef: {name: {{ .Values.backup.existingSecret }}, key: key}}
            {{- include "blobgate.optEnv" (dict "name" "BLOBGATE_BACKUP_KEEP" "value" .Values.backup.keep) | nindent 12 }}
            {{- include "blobgate.optEnv" (dict "name" "BLOBGATE_BACKUP_SECONDS" "value" .Values.backup.seconds) | nindent 12 }}
            {{- include "blobgate.optEnv" (dict "name" "BLOBGATE_RESTORE_ON_EMPTY" "value" (ternary "1" "" .Values.backup.restoreOnEmpty)) | nindent 12 }}
            {{- include "blobgate.optEnv" (dict "name" "BLOBGATE_RESTORE_FALLBACK" "value" (ternary "1" "" .Values.backup.restoreFallback)) | nindent 12 }}
            {{- end }}
            - name: HOSTNAME
              valueFrom: {fieldRef: {fieldPath: metadata.name}}
          readinessProbe: {httpGet: {path: /readyz, port: http}, periodSeconds: 5, timeoutSeconds: 4}
          livenessProbe: {httpGet: {path: /healthz, port: http}, initialDelaySeconds: 10, periodSeconds: 20, failureThreshold: 6}
          securityContext: {allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: {drop: [ALL]}}
          resources: {{- toYaml .Values.resources | nindent 12 }}
      {{- with .Values.nodeSelector }}
      nodeSelector: {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations: {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity: {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- if .Values.topologySpreadConstraints }}
      topologySpreadConstraints: {{- toYaml .Values.topologySpreadConstraints | nindent 8 }}
      {{- else if gt (int .Values.replicas) 1 }}
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels: {{- include "blobgate.selector" . | nindent 14 }}
      {{- end }}
