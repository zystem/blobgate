apiVersion: v1
kind: Service
metadata:
  name: {{ include "blobgate.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels: {{- include "blobgate.labels" . | nindent 4 }}
  {{- with .Values.service.annotations }}
  annotations: {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: {{ .Values.service.type }}
  selector: {{- include "blobgate.selector" . | nindent 4 }}
  ports:
    - {name: http, port: {{ .Values.config.port }}, targetPort: http}
    {{- if .Values.config.shimPort }}
    - {name: shim, port: {{ .Values.config.shimPort }}, targetPort: shim}
    {{- end }}
    {{- if .Values.config.s3Port }}
    - {name: s3, port: {{ .Values.config.s3Port }}, targetPort: s3}
    {{- end }}
    {{- if .Values.config.metricsPort }}
    - {name: metrics, port: {{ .Values.config.metricsPort }}, targetPort: metrics}
    {{- end }}
