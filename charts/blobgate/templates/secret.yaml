{{- if not .Values.existingSecret }}
{{- if or (not .Values.secrets.shards) (not .Values.secrets.adminToken) (not .Values.secrets.sealKey) }}
{{- fail "name a Secret in existingSecret, or give secrets.shards, secrets.adminToken and secrets.sealKey" }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "blobgate.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels: {{- include "blobgate.labels" . | nindent 4 }}
type: Opaque
stringData:
  shards: {{ include "blobgate.shards" . | quote }}
  adminToken: {{ .Values.secrets.adminToken | quote }}
  sealKey: {{ .Values.secrets.sealKey | quote }}
{{- end }}
