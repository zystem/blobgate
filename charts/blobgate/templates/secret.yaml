{{- if not .Values.existingSecret }}
{{- if or (and (not .Values.secrets.tenants) (not .Values.secrets.shards)) (not .Values.secrets.adminToken) (not .Values.secrets.sealKey) }}
{{- fail "name a Secret in existingSecret, or give secrets.tenants, secrets.adminToken and secrets.sealKey" }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "blobgate.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels: {{- include "blobgate.labels" . | nindent 4 }}
type: Opaque
stringData:
  tenants: {{ include "blobgate.tenants" . | quote }}
  adminToken: {{ .Values.secrets.adminToken | quote }}
  sealKey: {{ .Values.secrets.sealKey | quote }}
{{- end }}
