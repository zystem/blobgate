openapi: 3.0.3
info:
  title: blobgate (cinim-storage module) API
  version: "1"
  description: |
    The contract of the storage module (docs/storage-module.md), written down so that the Nim module and its Go replacement (blobgate) can be checked against one description.
    The module serves three kinds of caller on two ports:

    * the core, on `BLOBGATE_PORT` (18090), with a signed token per request (`coreToken`);
    * the operator, on the same port, with the admin token (`adminToken`);
    * a step's shim, on `BLOBGATE_SHIM_PORT` (18091), with a grant made by the core (`shimGrant`): only `PUT` of a part and `GET` of a range.

    The tenant is part of every key in the store: the object `acme/s1/app.txt` of tenant `001` lies as `001/acme/s1/app.txt`.
    Every error is `{"error": "<code>", "detail": "<words>"}`.
    The token strings are fixed byte for byte, see the schemes.
servers:
  - url: http://localhost:18090
    description: the core's and the operator's port
components:
  securitySchemes:
    coreToken:
      type: http
      scheme: bearer
      description: |
        `Bearer v2.<expires>.<mac>` with `X-Blobgate-Tenant: <tenant>`. mac = hex(HMAC-SHA256(secret of the tenant, `blobgate/call/v2|<len tenant>|<tenant>|<METHOD>|<len target>|<target>|<expires>`)),
        target = the decoded path plus `?` and the query as sent. Valid 120 s, clock skew allowed 30 s. The tokens of the first version are still accepted: `Bearer v1.<expires>.<mac>` made under the domain
        `cinim/storage/v1`, with the header `X-Cinim-Shard` (the old name of `X-Blobgate-Tenant`). `blobgate token` makes one.
    adminToken:
      type: http
      scheme: bearer
      description: 'the plain token of `BLOBGATE_ADMIN_TOKEN` (at least 16 characters); the core does not hold it.'
    shimGrant:
      type: http
      scheme: bearer
      description: |
        `Bearer g2.<tenant>.<expires>.<mac>` made by the caller for one upload (to put its parts) or one object (to read it); mac over `blobgate/grant/v2|...` (tenant, store, key, upload, mode), valid two hours.
        Grants of the first version (`g1`, domain `cinim/storage/grant/v1`) are still accepted.
  parameters:
    tenant:
      name: X-Blobgate-Tenant
      in: header
      required: true
      description: the tenant the call is made for (1..64 of lowercase letters, digits, `-` and `_`); `X-Cinim-Shard` is accepted as the old name
      schema: {type: string, pattern: "^[a-z0-9_][a-z0-9_-]{0,63}$"}
    store:
      name: store
      in: path
      required: true
      description: 'a store''s name, or `_default` for the default store (not on the shim port)'
      schema: {type: string}
    key:
      name: key
      in: path
      required: true
      description: 'relative, no empty, `.` or `..` parts, at most 1024 characters'
      schema: {type: string}
    sha256:
      name: X-Content-SHA256
      in: header
      required: true
      description: hex SHA-256 of the body, lowercase, sent before the body; the module checks it as it streams
      schema: {type: string, pattern: "^[0-9a-f]{64}$"}
    upload:
      name: upload
      in: query
      schema: {type: string}
    part:
      name: part
      in: query
      schema: {type: integer, minimum: 1, maximum: 10000}
  schemas:
    Error:
      type: object
      required: [error, detail]
      properties:
        error:
          type: string
          description: |
            unauthorized, no_such_object, no_such_store, not_configured, invalid_key, invalid_request, invalid_part, invalid_range, range_required, sha256_required, sha256_mismatch,
            empty_body, too_large, store_full, storage_unreachable, store_in_use, unavailable, database_unavailable, method_not_allowed, not_found, unreadable, newer_layout,
            invalid_sha256, invalid_metadata, precondition_failed, range_not_satisfiable, no_such_upload, encrypted_no_key, decrypt_failed, encryption_failed, store_error
        detail: {type: string}
    Size:
      type: object
      required: [size]
      properties: {size: {type: integer, format: int64}}
    StoreSummary:
      type: object
      properties:
        name: {type: string}
        kind: {type: string, description: "mirror or s3"}
        default: {type: boolean}
    StoreAdmin:
      type: object
      properties:
        name: {type: string}
        kind: {type: string}
        default: {type: boolean}
        endpoint: {type: string}
        region: {type: string}
        bucket: {type: string}
        access_key_id: {type: string}
        nodes: {type: array, items: {type: string}}
        min_acks: {type: integer}
        objects: {type: integer}
        space_url: {type: string}
        repair_pending: {type: integer, description: only for a mirror}
    StoreSettings:
      type: object
      description: the secret is sealed at rest and never returned
      properties:
        kind: {type: string, enum: [s3, mirror], default: s3}
        endpoint: {type: string}
        region: {type: string, default: garage}
        bucket: {type: string}
        access_key_id: {type: string}
        secret_access_key: {type: string}
        space_url: {type: string}
        nodes:
          type: array
          description: "mirror: every node is {remote: ':ftp,host=h:/path'} or {backend, options, path}, with `secrets` (options that are sealed: pass, secret_access_key) "
          items: {type: object}
        min_acks: {type: integer, description: "mirror: nodes that must confirm a write; 0 means all"}
        encryption:
          type: object
          description: |
            Seal the blocks written from now on with AES-256-GCM (docs/encryption.md). `keys` is every key an object was ever sealed with (id from 1 -> text of 16..256 printable characters);
            `key_id` is the one new blocks use. What is already written stays as it is and is still read; a key that is dropped makes what it sealed unreadable (500 encrypted_no_key).
          properties:
            key_id: {type: integer, minimum: 1}
            keys: {type: object, additionalProperties: {type: string}}
        default: {type: boolean}
  responses:
    Problem:
      description: an error
      content:
        application/json:
          schema: {$ref: "#/components/schemas/Error"}
    Unauthorized:
      description: the token or grant is wrong, expired or not for this call
      content:
        application/json:
          schema: {$ref: "#/components/schemas/Error"}
    StoreFull:
      description: 507 store_full, nothing was written; the detail says in words what is wrong and what to do. Two causes - the module knew beforehand that the block would not fit (the node says how much room it has, and less than the reserve would be left), or a node that cannot say reported at the write that it is out of space (disk full, FTP 552, WebDAV 507, a quota) and too few nodes took the block
      content:
        application/json:
          schema: {$ref: "#/components/schemas/Error"}
    Unavailable:
      description: 'the store or the database did not answer; `Retry-After` is set (the core retries 5xx and 429, but not 507)'
      headers:
        Retry-After: {schema: {type: integer}}
      content:
        application/json:
          schema: {$ref: "#/components/schemas/Error"}
paths:
  /healthz:
    get:
      summary: liveness
      security: []
      responses:
        "200": {description: '{"status":"ok"}'}
  /readyz:
    get:
      summary: readiness (the database answers)
      security: []
      responses:
        "200": {description: '{"status":"ready"}'}
        "503": {description: '{"status":"not_ready"}'}
  /v1/stores:
    get:
      summary: the stores and the default one, no secrets
      security: [{coreToken: []}]
      parameters: [{$ref: "#/components/parameters/tenant"}]
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema:
                type: object
                properties:
                  stores: {type: array, items: {$ref: "#/components/schemas/StoreSummary"}}
                  default: {type: string}
        "401": {$ref: "#/components/responses/Unauthorized"}
  /v1/stores/{store}/objects/{key}:
    parameters:
      - {$ref: "#/components/parameters/tenant"}
      - {$ref: "#/components/parameters/store"}
      - {$ref: "#/components/parameters/key"}
    put:
      summary: |
        write an object, or a part of a multipart upload with `?upload=<id>&part=<n>`. An object may be of any length: a body of known length up to 8 MiB is streamed to the nodes as it comes; a longer one, or one with
        no length (chunked), is cut into blocks of 8 MiB by the module, which holds one block at a time. `X-Content-SHA256` is optional for an object (the digest of the whole body: checked when sent) and required for a part.
        `Content-Type` and `X-Blobgate-Meta-<name>` headers are kept with the object and given back. `If-None-Match: *` (create only) and `If-Match: <etag>` (replace that version) are checked before the write,
        not as a part of it: two writers at the same moment can both pass. An object of no bytes is allowed; a part is at least one byte.
      security: [{coreToken: []}]
      parameters:
        - {name: X-Content-SHA256, in: header, schema: {type: string, pattern: "^[0-9a-f]{64}$"}, description: "required for a part, optional for an object"}
        - {name: Content-Type, in: header, schema: {type: string, maxLength: 255}}
        - {name: If-Match, in: header, schema: {type: string}}
        - {name: If-None-Match, in: header, schema: {type: string}}
        - {$ref: "#/components/parameters/upload"}
        - {$ref: "#/components/parameters/part"}
      requestBody:
        content:
          application/octet-stream: {schema: {type: string, format: binary}}
      responses:
        "200":
          description: "an object: {size}; a part: {etag} (the etag names the part's digest and length)"
        "400": {description: "invalid_sha256, sha256_required (a part), sha256_mismatch (nothing is left behind), invalid_key, invalid_part, empty_body (a part), invalid_metadata", content: {application/json: {schema: {$ref: "#/components/schemas/Error"}}}}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "404": {description: "no_such_store, no_such_upload"}
        "409": {description: not_configured}
        "412": {description: precondition_failed}
        "413": {description: "too_large (a part above 8 MiB, or an object above BLOBGATE_MAX_OBJECT_BYTES)"}
        "502": {description: the store said no}
        "503": {$ref: "#/components/responses/Unavailable"}
        "507": {$ref: "#/components/responses/StoreFull"}
    head:
      summary: what a GET would say, with no body (size, ETag, Last-Modified, Content-Type, the metadata); 404 with no body when there is no such object; honours If-None-Match and If-Match
      security: [{coreToken: []}]
      responses:
        "200": {description: ok}
        "304": {description: not modified}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "404": {description: no such object}
    get:
      summary: |
        read the whole object (200), or one range of it (206; `Range: bytes=a-b`, `bytes=a-`, `bytes=-n`; one range only). The bytes are streamed, a block at a time, each checked against its digest. The answer has
        `ETag` (a version of the object), `Last-Modified`, `Content-Type`, `Accept-Ranges`, `Content-Range` for a range and the `X-Blobgate-Meta-<name>` headers; `If-None-Match` gives 304 and `If-Match` 412.
        `?stat` gives {size, etag, content_type, modified, meta}, and `?upload=<id>&parts` the digests the module made of the parts it received.
      security: [{coreToken: []}]
      parameters:
        - {name: Range, in: header, schema: {type: string, example: "bytes=0-8388607"}}
        - {name: If-None-Match, in: header, schema: {type: string}}
        - {name: If-Match, in: header, schema: {type: string}}
        - {name: stat, in: query, allowEmptyValue: true, schema: {type: string}}
        - {name: parts, in: query, allowEmptyValue: true, schema: {type: string}}
        - {$ref: "#/components/parameters/upload"}
      responses:
        "200":
          description: "the object; `?stat`: {size, etag, content_type, modified, meta}; `?parts`: {parts: [{part, sha256, size}]}"
        "206": {description: 'the bytes of the range'}
        "304": {description: not modified}
        "400": {description: invalid_range}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "404": {description: no_such_object, no_such_store}
        "412": {description: precondition_failed}
        "416": {description: range_not_satisfiable, with `Content-Range: bytes */<size>`}
        "503": {$ref: "#/components/responses/Unavailable"}
    post:
      summary: "`?uploads[&size=<bytes>]` begins a multipart upload; `?upload=<id>` completes it"
      security: [{coreToken: []}]
      parameters:
        - {name: uploads, in: query, allowEmptyValue: true, schema: {type: string}}
        - {name: size, in: query, schema: {type: integer, format: int64}, description: the size of the whole object when known, counted by the room check}
        - {$ref: "#/components/parameters/upload"}
      requestBody:
        description: "complete only: {\"parts\": [[1, \"etag\"], ...]}, at most 10000 parts, at most 1 MiB"
        content:
          application/json: {schema: {type: object}}
      responses:
        "200": {description: "begin: {upload_id}; complete: {size}"}
        "400": {$ref: "#/components/responses/Problem"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "503": {$ref: "#/components/responses/Unavailable"}
        "507": {$ref: "#/components/responses/StoreFull"}
    delete:
      summary: 'delete the object (one that is not there is fine: {deleted: true}), or abort an upload with `?upload=<id>` ({aborted: true})'
      security: [{coreToken: []}]
      parameters: [{$ref: "#/components/parameters/upload"}]
      responses:
        "200": {description: done}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "503": {$ref: "#/components/responses/Unavailable"}
  /v1/admin/stores:
    get:
      summary: the stores with the number of objects and the repair queue
      security: [{adminToken: []}]
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema:
                type: object
                properties: {stores: {type: array, items: {$ref: "#/components/schemas/StoreAdmin"}}}
        "401": {$ref: "#/components/responses/Unauthorized"}
  /v1/admin/stores/{name}:
    parameters: [{name: name, in: path, required: true, schema: {type: string, pattern: "^[a-z][a-z0-9-]{0,31}$"}}]
    put:
      summary: 'try the settings (a round trip), then keep them; POST does the same (the chart''s registration scripts have only `wget`)'
      security: [{adminToken: []}]
      requestBody:
        content: {application/json: {schema: {$ref: "#/components/schemas/StoreSettings"}}}
      responses:
        "200": {description: "{name, checked: true}"}
        "400": {description: invalid_request, storage_unreachable (the message says what the store lacks)}
        "401": {$ref: "#/components/responses/Unauthorized"}
    delete:
      summary: 'forget the store; refused with 409 store_in_use while it holds objects unless `?force=1`'
      security: [{adminToken: []}]
      parameters: [{name: force, in: query, schema: {type: string}}]
      responses:
        "200": {description: "{deleted: true, name}"}
        "404": {description: no_such_store}
        "409": {description: store_in_use}
  /v1/admin/stores/{name}:check:
    post:
      summary: the round trip again
      security: [{adminToken: []}]
      parameters: [{name: name, in: path, required: true, schema: {type: string}}]
      responses:
        "200": {description: "{ok: true, name, kind}"}
        "404": {description: no_such_store}
        "502": {description: storage_unreachable}
  /v1/admin/stores/{name}:default:
    post:
      summary: make it the default store
      security: [{adminToken: []}]
      parameters: [{name: name, in: path, required: true, schema: {type: string}}]
      responses:
        "200": {description: "{name, default: true}"}
        "404": {description: no_such_store}
  /v1/admin/stores/{name}:reconcile:
    post:
      summary: |
        list every node of the store and compare it with the database (the check from outside: a node restored from an old backup, a database restored from one). Reports the directories of blocks
        that no object and no upload refers to, and the files that are in no directory of blocks (never removed). With `?apply` the strays older than `min_age` (seconds, default 86400) are written
        down for removal; nothing else is touched.
      security: [{adminToken: []}]
      parameters:
        - {name: name, in: path, required: true, schema: {type: string}}
        - {name: apply, in: query, allowEmptyValue: true, schema: {type: string}}
        - {name: min_age, in: query, schema: {type: integer, minimum: 0}}
      responses:
        "200": {description: "{store, nodes, files, expected, strays: [{node, dir, files, bytes, newest, recent}], unknown_files, queued}"}
        "404": {description: no_such_store}
  /metrics:
    get:
      summary: Prometheus metrics (docs/metrics.md); also on a port of its own with no token, `BLOBGATE_METRICS_PORT`
      security: [{adminToken: []}]
      responses:
        "200": {description: the metrics in the Prometheus text format}
        "401": {$ref: "#/components/responses/Unauthorized"}
  /v1/openapi.yaml:
    get:
      summary: this description
      security: []
      responses:
        "200": {description: this file}
x-shim-port:
  description: |
    The second port (`BLOBGATE_SHIM_PORT`, 18091, plain HTTP, its own pool, socket timeouts 30 s). Nothing else is open there.
    `PUT /s/{store}/{key}?upload=<id>&part=<n>` with `X-Content-SHA256` and a `g1` grant of mode `w`: 200 {etag}; 400 invalid_part, sha256_required, sha256_mismatch, empty_body; 413; 507 store_full.
    The module keeps (sha256, size) of the part in `storage_parts`, and the core compares them with what the shim reported before it completes the upload.
    `GET /s/{store}/{key}` with `Range: bytes=a-b` and a grant of mode `r`: 206 chunked stream; 400 range_required, invalid_range.
    `GET /healthz`. Any other route is 404 not_found; a wrong, expired or foreign grant is 401 unauthorized; `_default` is not a store name here.
